<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Politieschool - Lessensysteem</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
            font-size: 2em;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }

        /* Navigatie */
        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .login-area {
            display: flex;
            gap: 10px;
        }

        .role-badge {
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            color: white;
        }

        .role-docent { background: #28a745; }
        .role-student { background: #007bff; }

        /* Knoppen */
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            margin: 5px;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5a67d8;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-warning {
            background: #ffc107;
            color: #333;
        }

        .btn-info {
            background: #17a2b8;
            color: white;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 0.9em;
        }

        /* Les secties */
        .lessons-section {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .lesson-card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            border: 2px solid #ddd;
            transition: all 0.3s;
        }

        .lesson-card:hover {
            border-color: #667eea;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        .lesson-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 2px solid #ddd;
        }

        .lesson-title {
            font-size: 1.2em;
            font-weight: bold;
            color: #333;
        }

        .lesson-content {
            min-height: 100px;
            background: white;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #eee;
        }

        /* Element types */
        .element {
            background: white;
            border-radius: 8px;
            padding: 10px;
            margin: 10px 0;
            border-left: 4px solid #667eea;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .element-type {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.85em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .type-tekst { background: #e3f2fd; color: #1565c0; }
        .type-digibord { background: #f3e5f5; color: #7b1fa2; }
        .type-iframe { background: #e8f5e9; color: #2e7d32; }
        .type-afbeelding { background: #fff3e0; color: #e65100; }
        .type-pdf { background: #fce4ec; color: #c2185b; }

        .element-content {
            margin-top: 10px;
            padding: 15px;
            background: #fafafa;
            border-radius: 6px;
        }

        .element-content textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            min-height: 80px;
            resize: vertical;
            font-family: inherit;
        }

        .element-content iframe {
            width: 100%;
            height: 400px;
            border: none;
            border-radius: 6px;
        }

        .element-content img {
            max-width: 100%;
            height: auto;
            border-radius: 6px;
        }

        .element-content pdf-viewer {
            width: 100%;
            height: 600px;
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        /* Digibord specifieke styling */
        .digibord-container {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            border-radius: 10px;
            min-height: 400px;
            position: relative;
        }

        .digibord-toolbar {
            background: rgba(255,255,255,0.9);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }

        .digibord-tool {
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            background: #f0f0f0;
            transition: all 0.2s;
        }

        .digibord-tool:hover {
            background: #e0e0e0;
        }

        .digibord-tool.active {
            background: #667eea;
            color: white;
        }

        .digibord-color-btn {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 2px solid white;
            cursor: pointer;
            margin: 3px;
            transition: transform 0.2s;
        }

        .digibord-color-btn:hover {
            transform: scale(1.2);
        }

        .digibord-color-btn.active {
            border: 3px solid #333;
            transform: scale(1.1);
        }

        .digibord-canvas {
            background: white;
            border-radius: 8px;
            min-height: 300px;
            cursor: crosshair;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .digibord-input-area {
            margin-top: 15px;
            background: rgba(255,255,255,0.9);
            padding: 10px;
            border-radius: 8px;
        }

        .digibord-text-input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }

        .digibord-text-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .digibord-actions {
            margin-top: 10px;
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .digibord-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            z-index: 10;
        }

        .digibord-overlay-content {
            background: white;
            padding: 20px;
            border-radius: 10px;
            max-width: 500px;
            width: 90%;
        }

        /* Upload form */
        .upload-area {
            margin-top: 10px;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 6px;
            border: 2px dashed #ccc;
        }

        .upload-area input[type="file"] {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        /* Student view */
        .student-view {
            text-align: center;
            padding: 50px;
            background: #f8f9fa;
            border-radius: 10px;
            border: 2px dashed #ccc;
            margin: 20px;
        }

        .waiting-animation {
            font-size: 1.5em;
            color: #666;
            margin: 20px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.7; }
            50% { opacity: 1; }
            100% { opacity: 0.7; }
        }

        .lesson-active {
            border: 3px solid #28a745;
            background: #f0fff0;
        }

        /* Modals */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal {
            background: white;
            border-radius: 10px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .modal h3 {
            margin-bottom: 20px;
            color: #333;
        }

        .modal input, .modal select, .modal textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1em;
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        /* Dashboard */
        .dashboard {
            display: grid;
            grid-template-columns: 250px 1fr;
            gap: 20px;
            min-height: 700px;
        }

        .sidebar {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
        }

        .main-content {
            padding: 20px;
        }

        .lesson-section-title {
            font-size: 1.4em;
            margin-bottom: 20px;
            color: #333;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
            
            .lessons-section {
                grid-template-columns: 1fr;
            }
            
            .grid-2 {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🏛️ Politieschool - Lessensysteem</h1>
    
    <!-- Navigatie -->
    <div class="nav">
        <div class="login-area">
            <button class="btn btn-primary" onclick="loginUser('docent')">👨‍🏫 Inloggen als Docent</button>
            <button class="btn btn-info" onclick="loginUser('student')">👮 Inloggen als Student</button>
        </div>
        <div id="userInfo"></div>
    </div>

    <!-- Docent Dashboard -->
    <div id="docentDashboard" style="display: none;">
        <div class="dashboard">
            <!-- Sidebar met lessen -->
            <div class="sidebar">
                <h3>📚 Lessen</h3>
                <button class="btn btn-success" onclick="addLessonModal()">➕ Nieuwe Les</button>
                <div id="lessonList" class="lessons-section" style="display: block; margin-top: 20px;">
                    <!-- Lessen worden hier gegenereerd -->
                </div>
            </div>

            <!-- Hoofd content met les elementen -->
            <div class="main-content">
                <div class="lesson-section-title" id="activeLessonTitle">Selecteer een les om te bewerken</div>
                
                <div id="lessonElements" class="lesson-content">
                    <p style="text-align: center; color: #999; padding: 50px;">Selecteer een les om de elementen te bekijken</p>
                </div>

                <div id="elementControls" style="display: none; margin-top: 20px; padding-top: 20px; border-top: 2px solid #ddd;">
                    <h4>➕ Voeg element toe</h4>
                    <select id="elementType" class="form-select" style="padding: 10px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 6px;">
                        <option value="tekst">📝 Tekst</option>
                        <option value="digibord">🖥️ Digibord</option>
                        <option value="iframe">🌐 iframe</option>
                        <option value="afbeelding">🖼️ Afbeelding</option>
                        <option value="pdf">📄 PDF</option>
                    </select>
                    <button class="btn btn-success" onclick="addElement()">Element toevoegen</button>
                    <button class="btn btn-warning" onclick="startLesson()">🎯 Lesgeven</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Student Dashboard -->
    <div id="studentDashboard" style="display: none;">
        <div class="student-view">
            <h2>👮 Welkom Student</h2>
            <div id="studentLessonInfo">
                <div class="waiting-animation">
                    ⏳ Wachten tot de docent de les start...
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modals -->
<div class="modal-overlay" id="addLessonModal">
    <div class="modal">
        <h3>➕ Nieuwe les toevoegen</h3>
        <input type="text" id="newLessonName" placeholder="Naam van de les">
        <div class="modal-buttons">
            <button class="btn btn-danger" onclick="closeModal('addLessonModal')">Annuleren</button>
            <button class="btn btn-success" onclick="saveNewLesson()">Opslaan</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="addElementModal">
    <div class="modal">
        <h3 id="elementModalTitle">Element toevoegen</h3>
        <div id="elementInputArea">
            <!-- Dynamisch gegenereerde input velden -->
        </div>
        <div class="modal-buttons">
            <button class="btn btn-danger" onclick="closeModal('addElementModal')">Annuleren</button>
            <button class="btn btn-success" onclick="saveElement()">Opslaan</button>
        </div>
    </div>
</div>

<script>
    // State management
    let state = {
        currentUser: null,
        currentLesson: null,
        activeLesson: null,
        lessons: [
            {
                id: 1,
                name: "Introductie Politie",
                elements: [
                    {
                        id: 101,
                        type: "tekst",
                        content: "Welkom bij de politieschool! Dit is de introductieles.",
                        timestamp: Date.now()
                    },
                    {
                        id: 102,
                        type: "iframe",
                        content: "https://www.politie.nl",
                        timestamp: Date.now()
                    }
                ]
            },
            {
                id: 2,
                name: "Verkeersregels",
                elements: [
                    {
                        id: 201,
                        type: "tekst",
                        content: "In deze les behandelen we de belangrijkste verkeersregels.",
                        timestamp: Date.now()
                    }
                ]
            }
        ],
        studentLessons: []
    };

    // Initialisatie
    document.addEventListener('DOMContentLoaded', () => {
        loadFromLocalStorage();
        renderLessonList();
        updateNav();
    });

    // Local Storage management
    function saveToLocalStorage() {
        localStorage.setItem('politieschool_lessons', JSON.stringify(state.lessons));
        localStorage.setItem('politieschool_currentUser', JSON.stringify(state.currentUser));
    }

    function loadFromLocalStorage() {
        const savedLessons = localStorage.getItem('politieschool_lessons');
        if (savedLessons) {
            state.lessons = JSON.parse(savedLessons);
        }
        
        const savedUser = localStorage.getItem('politieschool_currentUser');
        if (savedUser) {
            state.currentUser = JSON.parse(savedUser);
            updateNav();
            showDashboard();
        }
    }

    // Login functies
    function loginUser(role) {
        state.currentUser = { role: role };
        saveToLocalStorage();
        updateNav();
        showDashboard();
        
        if (role === 'student') {
            state.studentLessons = [];
        }
    }

    function updateNav() {
        const userInfo = document.getElementById('userInfo');
        if (state.currentUser) {
            const roleLabel = state.currentUser.role === 'docent' ? '👨‍🏫 Docent' : '👮 Student';
            userInfo.innerHTML = `
                <span class="role-badge ${state.currentUser.role === 'docent' ? 'role-docent' : 'role-student'}">
                    ${roleLabel}
                </span>
                <button class="btn btn-danger btn-sm" onclick="logout()">Uitloggen</button>
            `;
        } else {
            userInfo.innerHTML = '';
        }
    }

    function logout() {
        state.currentUser = null;
        state.currentLesson = null;
        state.activeLesson = null;
        saveToLocalStorage();
        updateNav();
        document.getElementById('docentDashboard').style.display = 'none';
        document.getElementById('studentDashboard').style.display = 'none';
    }

    function showDashboard() {
        if (!state.currentUser) return;
        
        document.getElementById('docentDashboard').style.display = 
            state.currentUser.role === 'docent' ? 'block' : 'none';
        document.getElementById('studentDashboard').style.display = 
            state.currentUser.role === 'student' ? 'block' : 'none';
        
        if (state.currentUser.role === 'docent') {
            renderLessonList();
            renderLessonElements();
        } else {
            renderStudentView();
        }
    }

    // Docent functies
    function addLessonModal() {
        document.getElementById('addLessonModal').style.display = 'flex';
        document.getElementById('newLessonName').value = '';
    }

    function saveNewLesson() {
        const lessonName = document.getElementById('newLessonName').value.trim();
        if (!lessonName) return;
        
        const newLesson = {
            id: Date.now(),
            name: lessonName,
            elements: []
        };
        
        state.lessons.push(newLesson);
        saveToLocalStorage();
        renderLessonList();
        closeModal('addLessonModal');
    }

    function renderLessonList() {
        const lessonList = document.getElementById('lessonList');
        lessonList.innerHTML = '';
        
        state.lessons.forEach(lesson => {
            const card = document.createElement('div');
            card.className = 'lesson-card';
            card.style.marginBottom = '10px';
            
            card.innerHTML = `
                <div class="lesson-header">
                    <span class="lesson-title">📖 ${lesson.name}</span>
                    <button class="btn btn-danger btn-sm" onclick="deleteLesson(${lesson.id})">✖</button>
                </div>
                <div style="font-size: 0.9em; color: #666;">
                    ${lesson.elements.length} elementen
                </div>
                <button class="btn btn-primary btn-sm" onclick="selectLesson(${lesson.id})" style="margin-top: 10px; width: 100%;">
                    Bewerken
                </button>
            `;
            
            lessonList.appendChild(card);
        });
    }

    function selectLesson(lessonId) {
        state.currentLesson = state.lessons.find(l => l.id === lessonId);
        renderLessonElements();
        
        document.getElementById('activeLessonTitle').textContent = 
            `Bewerken: ${state.currentLesson.name}`;
        document.getElementById('elementControls').style.display = 'block';
    }

    function deleteLesson(lessonId) {
        if (confirm('Weet je zeker dat je deze les wilt verwijderen?')) {
            state.lessons = state.lessons.filter(l => l.id !== lessonId);
            if (state.currentLesson && state.currentLesson.id === lessonId) {
                state.currentLesson = null;
                document.getElementById('lessonElements').innerHTML = 
                    '<p style="text-align: center; color: #999; padding: 50px;">Selecteer een les om de elementen te bekijken</p>';
                document.getElementById('elementControls').style.display = 'none';
                document.getElementById('activeLessonTitle').textContent = 
                    'Selecteer een les om te bewerken';
            }
            saveToLocalStorage();
            renderLessonList();
        }
    }

    function renderLessonElements() {
        const lessonElements = document.getElementById('lessonElements');
        
        if (!state.currentLesson) {
            lessonElements.innerHTML = 
                '<p style="text-align: center; color: #999; padding: 50px;">Selecteer een les om de elementen te bekijken</p>';
            return;
        }
        
        lessonElements.innerHTML = '<div class="lesson-content">';
        
        if (state.currentLesson.elements.length === 0) {
            lessonElements.innerHTML += 
                '<p style="text-align: center; color: #999; padding: 30px;">Nog geen elementen. Voeg een element toe!</p>';
        } else {
            state.currentLesson.elements.forEach(element => {
                lessonElements.innerHTML += generateElementHTML(element);
            });
        }
        
        lessonElements.innerHTML += '</div>';
    }

    function generateElementHTML(element) {
        let contentHTML = '';
        
        switch(element.type) {
            case 'tekst':
                contentHTML = `<div class="element-content"><p style="white-space: pre-wrap;">${element.content}</p></div>`;
                break;
            case 'iframe':
                contentHTML = `<div class="element-content"><iframe src="${element.content}" allowfullscreen></iframe></div>`;
                break;
            case 'afbeelding':
                contentHTML = `<div class="element-content"><img src="${element.content}" alt="Afbeelding"></div>`;
                break;
            case 'pdf':
                contentHTML = `<div class="element-content"><pdf-viewer src="${element.content}"></pdf-viewer></div>`;
                break;
            case 'digibord':
                contentHTML = generateDigibordHTML(element);
                break;
        }
        
        return `
            <div class="element">
                <span class="element-type type-${element.type}">${getTypeLabel(element.type)}</span>
                <button class="btn btn-danger btn-sm" onclick="deleteElement(${element.id})" style="float: right; margin-bottom: 5px;">✖</button>
                ${contentHTML}
            </div>
        `;
    }

    // Nieuwe functies voor interactief digibord
    function generateDigibordHTML(element) {
        return `
            <div class="digibord-container">
                <div class="digibord-toolbar">
                    <button class="digibord-tool" onclick="setDigibordTool('pen', ${element.id})" id="pen-${element.id}">✏️ Pen</button>
                    <button class="digibord-tool" onclick="setDigibordTool('marker', ${element.id})" id="marker-${element.id}">🖍️ Marker</button>
                    <button class="digibord-tool" onclick="setDigibordTool('eraser', ${element.id})" id="eraser-${element.id}">🧽 Gum</button>
                    <button class="digibord-tool" onclick="setDigibordTool('text', ${element.id})" id="text-${element.id}">📝 Tekst</button>
                    <button class="digibord-tool" onclick="setDigibordTool('shapes', ${element.id})" id="shapes-${element.id}">⬜ Vormen</button>
                    <button class="digibord-tool" onclick="clearDigibord(${element.id})">🗑️ Wissen</button>
                    
                    <div style="margin-left: auto; display: flex; align-items: center;">
                        <span style="margin-right: 5px; font-size: 12px;">Kleur:</span>
                        <div class="digibord-color-btn" style="background: #000000;" onclick="setDigibordColor('#000000', ${element.id})" id="color-black-${element.id}"></div>
                        <div class="digibord-color-btn" style="background: #ff0000;" onclick="setDigibordColor('#ff0000', ${element.id})" id="color-red-${element.id}"></div>
                        <div class="digibord-color-btn" style="background: #0000ff;" onclick="setDigibordColor('#0000ff', ${element.id})" id="color-blue-${element.id}"></div>
                        <div class="digibord-color-btn" style="background: #00ff00;" onclick="setDigibordColor('#00ff00', ${element.id})" id="color-green-${element.id}"></div>
                        <div class="digibord-color-btn" style="background: #ff00ff;" onclick="setDigibordColor('#ff00ff', ${element.id})" id="color-pink-${element.id}"></div>
                        <div class="digibord-color-btn" style="background: #ffa500;" onclick="setDigibordColor('#ffa500', ${element.id})" id="color-orange-${element.id}"></div>
                    </div>
                </div>
                
                <div class="digibord-canvas" id="digibord-canvas-${element.id}">
                    <canvas id="digibord-draw-${element.id}" width="800" height="400" style="width: 100%; height: 100%;"></canvas>
                </div>
                
                <div class="digibord-input-area" id="digibord-input-${element.id}" style="display: none;">
                    <input type="text" class="digibord-text-input" id="digibord-text-${element.id}" placeholder="Typ hier je tekst...">
                    <button class="btn btn-primary btn-sm" onclick="addDigibordText(${element.id})">Tekst toevoegen</button>
                </div>
                
                <div class="digibord-actions">
                    <button class="btn btn-warning btn-sm" onclick="showDigibordOverlay(${element.id})">💾 Opslaan als afbeelding</button>
                </div>
            </div>
        `;
    }

    // Digibord state management
    let digibordStates = {};

    function getDigibordState(elementId) {
        if (!digibordStates[elementId]) {
            digibordStates[elementId] = {
                tool: 'pen',
                color: '#000000',
                isDrawing: false,
                lastX: 0,
                lastY: 0,
                canvasWidth: 800,
                canvasHeight: 400,
                texts: [],
                shapes: []
            };
        }
        return digibordStates[elementId];
    }

    function setDigibordTool(tool, elementId) {
        const state = getDigibordState(elementId);
        state.tool = tool;
        
        // Update UI
        const tools = ['pen', 'marker', 'eraser', 'text', 'shapes'];
        tools.forEach(t => {
            const btn = document.getElementById(`${t}-${elementId}`);
            if (btn) {
                btn.classList.toggle('active', t === tool);
            }
        });
        
        // Show/hide text input
        const inputArea = document.getElementById(`digibord-input-${elementId}`);
        if (tool === 'text') {
            inputArea.style.display = 'block';
        } else {
            inputArea.style.display = 'none';
        }
    }

    function setDigibordColor(color, elementId) {
        const state = getDigibordState(elementId);
        state.color = color;
        
        // Update UI
        const colors = ['#000000', '#ff0000', '#0000ff', '#00ff00', '#ff00ff', '#ffa500'];
        colors.forEach(c => {
            const btn = document.getElementById(`color-${c.replace('#', '')}-${elementId}`);
            if (btn) {
                btn.classList.toggle('active', c === color);
            }
        });
    }

    function clearDigibord(elementId) {
        if (confirm('Weet je zeker dat je het digibord wilt wissen?')) {
            const canvas = document.getElementById(`digibord-draw-${elementId}`);
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const state = getDigibordState(elementId);
            state.texts = [];
            state.shapes = [];
        }
    }

    function addDigibordText(elementId) {
        const textInput = document.getElementById(`digibord-text-${elementId}`);
        const text = textInput.value.trim();
        
        if (text) {
            const state = getDigibordState(elementId);
            state.texts.push(text);
            
            const canvas = document.getElementById(`digibord-draw-${elementId}`);
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = state.color;
            ctx.font = '20px Arial';
            ctx.fillText(text, 50, state.texts.length * 30 + 50);
            
            textInput.value = '';
        }
    }

    function showDigibordOverlay(elementId) {
        const canvas = document.getElementById(`digibord-draw-${elementId}`);
        const overlay = document.createElement('div');
        overlay.className = 'digibord-overlay';
        overlay.innerHTML = `
            <div class="digibord-overlay-content">
                <h3>💾 Digibord opslaan</h3>
                <p>Kies een optie:</p>
                <button class="btn btn-primary" onclick="downloadDigibordImage(${elementId})">📥 Download als afbeelding</button>
                <button class="btn btn-success" onclick="saveDigibordToLesson(${elementId})">💾 Opslaan in les</button>
                <button class="btn btn-danger" onclick="this.parentElement.parentElement.remove()">Annuleren</button>
            </div>
        `;
        
        document.body.appendChild(overlay);
    }

    function downloadDigibordImage(elementId) {
        const canvas = document.getElementById(`digibord-draw-${elementId}`);
        const link = document.createElement('a');
        link.download = `digibord-${Date.now()}.png`;
        link.href = canvas.toDataURL();
        link.click();
        
        // Close overlay
        const overlay = document.querySelector('.digibord-overlay');
        if (overlay) overlay.remove();
    }

    function saveDigibordToLesson(elementId) {
        const canvas = document.getElementById(`digibord-draw-${elementId}`);
        const imageData = canvas.toDataURL();
        
        // Find the element in the current lesson
        if (state.currentLesson) {
            const element = state.currentLesson.elements.find(e => e.id === elementId);
            if (element) {
                element.content = `data:image/png;base64,${imageData.split(',')[1]}`;
                saveToLocalStorage();
                alert('Digibord is opgeslagen!');
            }
        }
        
        // Close overlay
        const overlay = document.querySelector('.digibord-overlay');
        if (overlay) overlay.remove();
    }

    // Canvas teken functionaliteit
    document.addEventListener('mousedown', function(e) {
        if (e.target.tagName === 'CANVAS' && e.target.id.startsWith('digibord-draw-')) {
            const elementId = parseInt(e.target.id.split('-')[2]);
            const state = getDigibordState(elementId);
            state.isDrawing = true;
            
            const rect = e.target.getBoundingClientRect();
            state.lastX = e.clientX - rect.left;
            state.lastY = e.clientY - rect.top;
        }
    });

    document.addEventListener('mousemove', function(e) {
        if (e.target.tagName === 'CANVAS' && e.target.id.startsWith('digibord-draw-')) {
            const elementId = parseInt(e.target.id.split('-')[2]);
            const state = getDigibordState(elementId);
            
            if (state.isDrawing) {
                const ctx = e.target.getContext('2d');
                const rect = e.target.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                ctx.strokeStyle = state.color;
                ctx.lineWidth = state.tool === 'marker' ? 8 : state.tool === 'eraser' ? 20 : 3;
                ctx.lineCap = 'round';
                
                if (state.tool === 'eraser') {
                    ctx.globalCompositeOperation = 'destination-out';
                    ctx.beginPath();
                    ctx.moveTo(state.lastX, state.lastY);
                    ctx.lineTo(x, y);
                    ctx.stroke();
                    ctx.globalCompositeOperation = 'source-over';
                } else {
                    ctx.beginPath();
                    ctx.moveTo(state.lastX, state.lastY);
                    ctx.lineTo(x, y);
                    ctx.stroke();
                }
                
                state.lastX = x;
                state.lastY = y;
            }
        }
    });

    document.addEventListener('mouseup', function(e) {
        if (e.target.tagName === 'CANVAS' && e.target.id.startsWith('digibord-draw-')) {
            const elementId = parseInt(e.target.id.split('-')[2]);
            const state = getDigibordState(elementId);
            state.isDrawing = false;
        }
    });
