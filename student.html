<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Student - Politieschool</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; }
        #waiting { font-size: 24px; color: #888; }
        #lesson-display { border: 2px solid green; padding: 20px; margin-top: 20px; display: none; text-align: left; background: #f9f9f9; }
        h1 { color: #003366; }
        .back-link { display: block; margin-bottom: 10px; text-align: left; }
    </style>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>
<a href="index.html" class="back-link">← Terug naar start</a>
<h1>Studentenomgeving</h1>
<button onclick="loginStudent()">Login als Student</button>

<div id="student-area" style="display:none;">
    <div id="waiting">
        <p>Wachten op les...</p>
        <p style="font-size: 16px; color: #aaa;">Zodra de docent de les start, verschijnt deze hier.</p>
    </div>
    <div id="lesson-display"></div>
</div>

<script>
    // 🔥 Jouw Firebase configuratie
    const firebaseConfig = {
        apiKey: "AIzaSyBEod8zm1jvvkmPbe6cA_SQo2U_esC9yTY",
        authDomain: "aangiftebotje.firebaseapp.com",
        databaseURL: "https://aangiftebotje-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "aangiftebotje",
        storageBucket: "aangiftebotje.firebasestorage.app",
        messagingSenderId: "825633841222",
        appId: "1:825633841222:web:15d93d08e2b719285dea47"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const activeLessonRef = db.ref('politieschool/activeLesson');

    function loginStudent() {
        document.getElementById('student-area').style.display = 'block';
        // Luister naar actieve les
        activeLessonRef.on('value', (snap) => {
            const lesson = snap.val();
            if (lesson) {
                document.getElementById('waiting').style.display = 'none';
                const display = document.getElementById('lesson-display');
                display.style.display = 'block';

                let html = `<h2>${lesson.lessonName} (${lesson.q})</h2>`;
                (lesson.content || []).forEach(el => {
                    if (el.type === 'tekst') html += `<p>${el.content}</p>`;
                    else if (el.type === 'digibord') html += `<div style="background:yellow; height:100px; margin:10px;">✍️ Digibord</div>`;
                    else if (el.type === 'iframe') html += `<iframe src="${el.content}" width="100%" height="400px" style="margin:10px;"></iframe>`;
                    else if (el.type === 'afbeelding') html += `<img src="${el.content}" style="max-width:100%; margin:10px;">`;
                    else if (el.type === 'pdf') html += `<iframe src="${el.content}" width="100%" height="500px" style="margin:10px;"></iframe>`;
                });
                display.innerHTML = html;
            } else {
                // Geen actieve les → wachten
                document.getElementById('waiting').style.display = 'block';
                document.getElementById('lesson-display').style.display = 'none';
            }
        });
    }
</script>
</body>
</html>
